[pytest]
testpaths = tests
addopts = -ra --strict-markers -m "not performance and not e2e_gui"
markers =
    unit: fast isolated tests for a single component
    integration: tests that combine repositories, SQLite, exporters, or viewmodels
    e2e: complete user workflow from project creation to exported output
    e2e_gui: offscreen PySide6 end-to-end GUI smoke tests
    performance: workload and timing checks; excluded from the default quick run
    security: security and data-integrity regression tests
    slow: tests that can take several seconds or more
